<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عجلة الحظ – اختاري تحدّيك | فقرة تفاعلية ودعم نفسي</title>
    <meta name="description" content="فقرة تفاعلية ممتعة ودعم نفسي وتفريغ انفعالي للسيدات مع عجلة الحظ التفاعلية" />
    <meta property="og:title" content="عجلة الحظ – اختاري تحدّيك | فقرة تفاعلية ودعم نفسي" />
    <meta property="og:description" content="فقرة تفاعلية ممتعة ودعم نفسي وتفريغ انفعالي للسيدات مع عجلة الحظ التفاعلية" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Inline core styles so GitHub Pages never flashes a white screen even if opened raw -->
    <style>
      :root {
        --uossm-orange: #EE6B33;
        --uossm-orange-bright: #FF854D;
        --uossm-orange-deep: #B84211;
        --uossm-slate: #8D9BA8;
        --uossm-silver: #E2E8F0;
        --uossm-blue: #38BDF8;
        --bg-deep: #091326;
      }
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: 'Cairo', 'Tajawal', sans-serif;
        background-color: var(--bg-deep);
        background-image: 
          radial-gradient(circle at 72% 45%, rgba(238, 107, 51, 0.16) 0%, rgba(238, 107, 51, 0.04) 38%, transparent 68%),
          radial-gradient(circle at 22% 30%, rgba(141, 155, 168, 0.16) 0%, rgba(56, 189, 248, 0.06) 40%, transparent 70%),
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.06) 0%, transparent 50%),
          linear-gradient(160deg, #070F1E 0%, #0E1D38 48%, #091326 100%);
        color: #ffffff;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .icon-3d-box {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.04) 100%);
        border-top: 1.5px solid rgba(255, 255, 255, 0.65);
        border-left: 1px solid rgba(255, 255, 255, 0.35);
        border-right: 1px solid rgba(0, 0, 0, 0.25);
        border-bottom: 4px solid rgba(0, 0, 0, 0.45);
        box-shadow:
          0 8px 16px -2px rgba(0, 0, 0, 0.55),
          0 4px 0 0 rgba(15, 23, 42, 0.8),
          inset 0 2px 4px rgba(255, 255, 255, 0.45),
          inset 0 -3px 6px rgba(0, 0, 0, 0.35);
        transform: perspective(500px) translateZ(0);
        transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .icon-3d-box::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 12%;
        right: 12%;
        height: 35%;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
      }
      .icon-3d-glyph {
        filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.55)) drop-shadow(0 1px 0 rgba(255, 255, 255, 0.4));
        transform: translateZ(12px);
        display: inline-block;
      }
      .btn-3d-orange {
        background: linear-gradient(180deg, #FF854D 0%, #EE6B33 55%, #D4521B 100%);
        border-top: 1.5px solid rgba(255, 230, 215, 0.8);
        border-bottom: 4px solid #8C310A;
        box-shadow:
          0 6px 0 #7C2806,
          0 12px 24px rgba(238, 107, 51, 0.45),
          inset 0 2px 2px rgba(255, 255, 255, 0.45);
        transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .btn-3d-orange:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow:
          0 8px 0 #7C2806,
          0 16px 30px rgba(238, 107, 51, 0.6),
          inset 0 2px 3px rgba(255, 255, 255, 0.6);
      }
      .btn-3d-orange:active:not(:disabled) {
        transform: translateY(4px);
        box-shadow:
          0 2px 0 #7C2806,
          0 5px 12px rgba(238, 107, 51, 0.35),
          inset 0 1px 2px rgba(255, 255, 255, 0.3);
      }
      .btn-3d-slate {
        background: linear-gradient(180deg, #1E3252 0%, #122038 100%);
        border-top: 1px solid rgba(226, 232, 240, 0.38);
        border-left: 1px solid rgba(226, 232, 240, 0.2);
        border-right: 1px solid rgba(226, 232, 240, 0.2);
        border-bottom: 3px solid #070E1B;
        box-shadow:
          0 4px 0 #060C18,
          0 8px 16px rgba(0, 0, 0, 0.45),
          inset 0 1px 1px rgba(255, 255, 255, 0.2);
        transition: all 0.15s ease;
      }
      .btn-3d-slate:hover {
        transform: translateY(-2px);
        border-top-color: rgba(238, 107, 51, 0.75);
        box-shadow:
          0 6px 0 #060C18,
          0 12px 20px rgba(238, 107, 51, 0.2),
          inset 0 1px 2px rgba(255, 255, 255, 0.3);
      }
      .btn-3d-slate:active {
        transform: translateY(2px);
        box-shadow:
          0 2px 0 #060C18,
          0 4px 8px rgba(0, 0, 0, 0.4);
      }
      .wheel-stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 28px rgba(238, 107, 51, 0.28));
      }
      .wheel-outer-glow {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          #EE6B33,
          #CBD5E1,
          #38BDF8,
          #EE6B33,
          #F59E0B,
          #CBD5E1,
          #EE6B33
        );
        filter: blur(20px);
        opacity: 0.48;
        z-index: 0;
        animation: pulseGlow 4.5s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.38; transform: scale(0.98); }
        100% { opacity: 0.68; transform: scale(1.02); }
      }
      .spin-btn-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 24%;
        height: 24%;
        min-width: 82px;
        min-height: 82px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, #FFFFFF 0%, #E2E8F0 42%, #94A3B8 85%, #475569 100%);
        border: 4px solid #EE6B33;
        box-shadow: 
          0 10px 24px rgba(0, 0, 0, 0.75),
          0 0 25px rgba(238, 107, 51, 0.75),
          inset 0 4px 8px rgba(255, 255, 255, 0.95),
          inset 0 -6px 10px rgba(71, 85, 105, 0.7);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 20;
        transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .spin-btn-center:hover:not(:disabled) {
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 
          0 14px 30px rgba(0, 0, 0, 0.8),
          0 0 40px rgba(238, 107, 51, 0.95),
          inset 0 4px 10px rgba(255, 255, 255, 1),
          inset 0 -6px 12px rgba(71, 85, 105, 0.8);
      }
      .spin-btn-center:active:not(:disabled) {
        transform: translate(-50%, -50%) scale(0.95);
      }
      .spin-btn-center:disabled {
        cursor: not-allowed;
        opacity: 0.85;
      }
      .spin-label {
        font-family: 'Cairo', sans-serif;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #EE6B33;
        text-shadow: 
          0 2px 0 #8C310A,
          0 4px 8px rgba(238, 107, 51, 0.45);
        line-height: 1;
      }
      .wheel-pointer {
        position: absolute;
        top: -22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 12px rgba(238, 107, 51, 0.85));
        transform-origin: 50% 10px;
        transition: transform 0.08s ease-out;
      }
      .pointer-tick {
        transform: translateX(-50%) rotate(-18deg) !important;
      }
      .number-card {
        background: linear-gradient(165deg, rgba(23, 39, 68, 0.92) 0%, rgba(12, 23, 43, 0.95) 100%);
        backdrop-filter: blur(12px);
        border-top: 1px solid rgba(226, 232, 240, 0.28);
        border-left: 1px solid rgba(226, 232, 240, 0.14);
        border-right: 1px solid rgba(226, 232, 240, 0.14);
        border-bottom: 4px solid rgba(5, 10, 22, 0.9);
        box-shadow:
          0 8px 18px -4px rgba(0, 0, 0, 0.5),
          inset 0 1px 1px rgba(255, 255, 255, 0.15);
        transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .number-card:hover {
        transform: translateY(-3px) scale(1.01);
        border-top-color: rgba(238, 107, 51, 0.85);
        border-left-color: rgba(238, 107, 51, 0.45);
        border-right-color: rgba(238, 107, 51, 0.45);
        box-shadow:
          0 14px 26px -4px rgba(238, 107, 51, 0.28),
          0 4px 0 rgba(238, 107, 51, 0.4),
          inset 0 1px 2px rgba(255, 255, 255, 0.3);
      }
      .number-card:hover .icon-3d-box {
        transform: perspective(500px) translateY(-3px) rotateX(8deg) scale(1.07);
      }
      .number-card.completed {
        border-top-color: rgba(16, 185, 129, 0.55);
        border-bottom-color: rgba(4, 47, 36, 0.95);
        background: linear-gradient(165deg, rgba(10, 46, 40, 0.82) 0%, rgba(7, 28, 26, 0.9) 100%);
      }
      .breathing-circle {
        animation: breatheAnim 8s ease-in-out infinite;
      }
      @keyframes breatheAnim {
        0%, 100% {
          transform: scale(0.85);
          box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        50% {
          transform: scale(1.22);
          box-shadow: 0 0 45px rgba(56, 189, 248, 0.9), 0 0 70px rgba(238, 107, 51, 0.5);
        }
      }
      @keyframes float3D {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .float-3d {
        animation: float3D 3.5s ease-in-out infinite;
      }
      .modal-enter {
        animation: modalPop 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes modalPop {
        0% { opacity: 0; transform: scale(0.88) translateY(20px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatic fallback for GitHub Pages (when repository root is served directly without Vite server)
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            var tw = document.createElement('script');
            tw.src = 'https://cdn.tailwindcss.com';
            document.head.appendChild(tw);

            var bundle = document.createElement('script');
            bundle.src = './github-bundle.js';
            bundle.onerror = function () {
              var altBundle = document.createElement('script');
              altBundle.src = './public/github-bundle.js';
              document.body.appendChild(altBundle);
            };
            document.body.appendChild(bundle);
          }
        }, 250);
      });
    </script>
  </body>
</html>
